<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Viewer through a forwarder</title>
<style>
  :root { color-scheme: light dark; --bg: #f4f5f7; --fg: #1d2129; --muted: #6b7280; --panel: #ffffff; --line: #d9dde3; }
  @media (prefers-color-scheme: dark) { :root { --bg: #15171b; --fg: #e6e8ec; --muted: #9aa1ab; --panel: #1e2126; --line: #30343b; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
  form { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; padding: 12px 16px; background: var(--panel);
         border-bottom: 1px solid var(--line); }
  label { display: flex; flex-direction: column; gap: 2px; color: var(--muted); font-size: 12px; }
  input, select, button { font: inherit; padding: 4px 8px; }
  input[name=key] { width: 34em; font-family: ui-monospace, monospace; }
  input[name=token] { width: 18em; font-family: ui-monospace, monospace; }
  #status { padding: 6px 16px; color: var(--muted); font-family: ui-monospace, monospace; font-size: 12px; }
  #screens { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; }
  canvas { display: block; width: 100%; height: calc(100vh - 120px); object-fit: contain; background: #000; outline: none; }
</style>
</head>
<body>
<!-- Test software, not part of the SDK: a viewer in the page through a forwarder (rcs_forwarder),
     which serve.mjs (--forwarder) stands in front of as a TLS proxy would: the page's WebSocket at
     /forwarder goes on to the forwarder's WebSocket entry. serve.mjs, as the host's server, signs the
     page a viewer's token for the room (posted, never in a URL) and a fresh one when the session
     reconnects (refreshToken). The sharer publishes to the same room (rcsdk_cli --transport forwarder);
     its admission and the end-to-end key are as without a forwarder. The key and serve.mjs's token are
     typed in (or given to viewer.connect() from a test), never taken from the URL. -->
<form id="connect">
  <label>Room <input name="room" value="r1"></label>
  <label>Token (serve.mjs) <input name="token" type="password" required autocomplete="off"></label>
  <label>Key (hex, 32 bytes) <input name="key" type="password" required pattern="[0-9a-fA-F]{64}" autocomplete="off"></label>
  <label>Decoder <select name="acceleration"><option value="hardware">hardware</option>
    <option value="software">software</option><option value="hardwareFirst">hardware first</option></select></label>
  <button>Connect</button>
  <button type="button" id="disconnect" disabled>Disconnect</button>
</form>
<div id="status">loading…</div>
<div id="screens"></div>
<script type="module">
import { load, VideoView, InputMapper, CursorView } from './rcsdk.mjs';

const status = document.getElementById('status');
const form = document.getElementById('connect');
const screens = document.getElementById('screens');
const params = new URLSearchParams(location.search);
if (params.has('room')) form.elements.room.value = params.get('room');
let session = null, ticker = 0, sdk = null, refresh = null;
const views = new Map(); // stream -> { view, input, cursor, canvas }
const socketUrl = `${location.origin.replace(/^http/, 'ws')}/forwarder`;
// For tests in the browser's console: viewer.connect({ room, token, key }) fills the form and connects.
window.viewer = { views, get session() { return session; }, get sdk() { return sdk; },
                  connect(fields) {
                    for (const [name, value] of Object.entries(fields)) form.elements[name].value = value;
                    form.requestSubmit();
                  } };

try {
  sdk = await load();
  status.textContent = 'ready; decodes ' + Object.entries(sdk.decoders)
    .map(([codec, d]) => `${codec}: hardware [${d.hardware}] software [${d.software}]`).join('; ');
} catch (error) {
  status.textContent = 'cannot load: ' + error.message;
}

// serve.mjs's answer: { token, keySha256, refresh }; the refresh ticket gets the next one, once.
async function forwarderToken(body) {
  const answer = await fetch('/forwarder-token', { method: 'POST', body: JSON.stringify(body) });
  if (!answer.ok) throw new Error('serve.mjs gave no token: ' + await answer.text());
  const given = await answer.json();
  refresh = given.refresh;
  return given;
}

function showStream(stream) {
  if (views.has(stream)) return;
  const canvas = document.createElement('canvas');
  screens.appendChild(canvas);
  const view = new VideoView(session, canvas, { stream });
  views.set(stream, { view, input: new InputMapper(session, view), cursor: new CursorView(session, view), canvas });
}

function hideStream(stream) {
  const entry = views.get(stream);
  if (!entry) return;
  entry.input.close();
  entry.cursor.close();
  entry.view.close();
  VideoView.releaseCanvas(sdk, entry.canvas);
  entry.canvas.remove();
  views.delete(stream);
}

async function disconnect() {
  clearInterval(ticker);
  for (const stream of [...views.keys()]) hideStream(stream);
  const ending = session;
  session = refresh = null;
  document.getElementById('disconnect').disabled = true;
  if (ending) await ending.destroy();
}

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  await disconnect();
  const hex = form.elements.key.value;
  const key = new Uint8Array(hex.match(/../g).map((byte) => parseInt(byte, 16)));
  form.elements.key.value = ''; // The session has it now.
  let first;
  try {
    first = await forwarderToken({ token: form.elements.token.value, room: form.elements.room.value });
  } catch (error) {
    status.textContent = 'failed: ' + error.message;
    return;
  }
  const current = session = sdk.createSession({
    key,
    forwarder: { keySha256: first.keySha256, token: first.token,
                 refreshToken: async () => refresh && (await forwarderToken({ refresh })).token },
    decoder: { acceleration: form.elements.acceleration.value },
    viewRequest: { cursor: 'separate' },
  });
  showStream(0);
  session.addEventListener('state', (e) => console.log('state', e.detail.state, e.detail.message ?? ''));
  session.addEventListener('stream', (e) => {
    console.log('stream', e.detail.stream, e.detail.ended ? 'ended' : e.detail.info);
    if (e.detail.ended) { if (e.detail.stream) hideStream(e.detail.stream); } else showStream(e.detail.stream);
  });
  session.addEventListener('codec', (e) => console.log('codec', e.detail));
  // One WebSocket is one hop to the forwarder: when it closes, another, and the session reconnects over it.
  session.addEventListener('socketclose', () => {
    if (session === current && !['stopped', 'failed'].includes(current.state)) {
      setTimeout(() => { if (session === current) current.connectWebSocket(socketUrl).catch(() => {}); }, 1000);
    }
  });
  document.getElementById('disconnect').disabled = false;
  try {
    await session.connectWebSocket(socketUrl);
    await session.start();
  } catch (error) {
    status.textContent = 'failed: ' + error.message;
    return;
  }
  let last = { frames: 0, time: performance.now() };
  ticker = setInterval(() => {
    if (!session) return;
    const s = session.stats(), now = performance.now(), v = s.videoReceive, f = s.forwarder, a = s.audioReceive;
    const info = session.info().stream;
    const fps = ((v.decodedFrames - last.frames) * 1000 / (now - last.time)).toFixed(1);
    last = { frames: v.decodedFrames, time: now };
    status.textContent = `${session.state} · encoding ${info.encoding} of ${info.encodings} · ${info.width}x${info.height} ` +
      `${info.codec} · ${fps} FPS · decoded ${v.decodedFrames} · forwarder peer ${f.peer}, opened ${f.mediaFrames} ` +
      `(${f.mediaUnkeyed} without their key, ${f.mediaRejected} refused), key ${f.generation}.${f.step}, hop rtt ` +
      `${(f.hopRoundTripNs / 1e6).toFixed(1)} ms · sound ${f.soundPackets} packets, ${a.active ? 'playing' : 'paused'}`;
  }, 1000);
});
document.getElementById('disconnect').addEventListener('click', disconnect);
if (params.has('auto')) setInterval(() => console.log('status ' + status.textContent), 1000); // Tests: the status each second.
</script>
</body>
</html>
