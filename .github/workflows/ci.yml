# Builds and tests when started by hand (Actions > CI > Run workflow, or
# `gh workflow run CI --ref <branch>`), not on every push: macOS minutes of a
# private repository count ten times. macOS (release and AddressSanitizer +
# UndefinedBehaviorSanitizer, and an x86-64 build), the Windows x64 build
# cross-compiled with LLVM-MinGW, and the forwarder on Linux (x86-64 and
# arm64, and its container). Hardware paths (screen capture, input, audio
# devices) are replaced by the tests' own sources; device behaviour is
# verified on real machines (docs/ROADMAP.md).
# The Linux jobs alone, without the macOS minutes:
#   gh workflow run CI --ref <branch> -f jobs=forwarder-linux
name: CI

on:
  workflow_dispatch:
    inputs:
      jobs:
        description: Which jobs (forwarder-linux runs on Linux runners only)
        type: choice
        options: [all, forwarder-linux]
        default: all

jobs:
  macos:
    if: inputs.jobs == 'all'
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        preset: [release, asan]
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }} -j 4

  # Intel Macs: built for x86-64 on the arm64 runner (a slice's own SIMD and
  # Objective-C types differ); the tests are run by hand under Rosetta.
  macos-x86_64:
    if: inputs.jobs == 'all'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake --preset macos-x86_64
      - name: Build
        run: cmake --build --preset macos-x86_64

  windows-cross:
    if: inputs.jobs == 'all'
    runs-on: macos-15
    env:
      LLVM_MINGW: llvm-mingw-20260922-ucrt-macos-universal
    steps:
      - uses: actions/checkout@v7
      - name: LLVM-MinGW
        run: |
          curl -fsSL -o toolchain.tar.xz \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/20260922/${LLVM_MINGW}.tar.xz"
          tar -xf toolchain.tar.xz
      - name: Configure
        run: cmake --preset windows-x64-release -DLLVM_MINGW_ROOT="$PWD/$LLVM_MINGW"
      - name: Build
        run: cmake --build --preset windows-x64-release

  # The forwarder as a Linux server (server/forwarder/; the SDK's ends do not
  # support Linux): built with Ubuntu's GCC and BearSSL, its tests, then the
  # ends' scenarios through it and wss:// (the portable code with OpenH264,
  # which needs NASM on x86-64).
  forwarder-linux:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build g++ nasm
      - name: Configure
        run: cmake --preset linux-forwarder-scenarios
      - name: Build
        run: cmake --build --preset linux-forwarder-scenarios
      - name: Test
        run: ctest --preset linux-forwarder-scenarios

  # The container of server/forwarder/deploy/Dockerfile (linux-forwarder, the
  # program alone), and the program in it.
  forwarder-container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -f server/forwarder/deploy/Dockerfile -t rcs-forwarder .
      - name: Run
        run: docker run --rm rcs-forwarder --generate-identity /tmp/identity.key
